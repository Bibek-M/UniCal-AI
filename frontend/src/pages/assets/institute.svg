<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <defs>
    <!-- Building subtle fill gradient -->
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf0f8"/>
    </linearGradient>

    <!-- Foliage gradient -->
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4e1f4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#b6cbe7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Ground mound gradient -->
    <linearGradient id="moundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dde8f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c5d8ef" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- STYLES -->
  <style>
    .stroke-main { stroke: #9bb7da; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-thick { stroke: #8caad0; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-thin { stroke: #a9c2e2; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .window-fill { fill: #9bb9de; }
    .bldg-fill { fill: url(#buildingGrad); }
    .tree-fill { fill: url(#treeGrad); }
    .trunk { stroke: #8ba8cd; stroke-width: 2.2; stroke-linecap: round; }
    .branch { stroke: #8ba8cd; stroke-width: 1.4; stroke-linecap: round; }
  </style>

  <!-- ==================== MAIN BUILDING ==================== -->
  <g id="building">
    <!-- Left Wing -->
    <rect class="bldg-fill stroke-main" x="123" y="132" width="90" height="74"/>
    <!-- Left Wing Cornice / Roof band -->
    <path class="bldg-fill stroke-main" d="M120 132 L213 132 L213 126 L120 126 Z"/>

    <!-- Right Wing -->
    <rect class="bldg-fill stroke-main" x="287" y="132" width="90" height="74"/>
    <!-- Right Wing Cornice / Roof band -->
    <path class="bldg-fill stroke-main" d="M287 132 L380 132 L380 126 L287 126 Z"/>

    <!-- Central Pavilion (Front projection) -->
    <rect class="bldg-fill stroke-main" x="210" y="112" width="80" height="94"/>
    <!-- Central Cornice -->
    <path class="bldg-fill stroke-main" d="M206 112 L294 112 L294 106 L206 106 Z"/>

    <!-- Tower Level 1 (Base section) -->
    <rect class="bldg-fill stroke-main" x="227" y="69" width="46" height="37"/>
    <!-- Tower Level 1 Top Ledge -->
    <path class="bldg-fill stroke-main" d="M225 72 L275 72 L275 68 L225 68 Z"/>

    <!-- Tower Level 2 (Belfry/Clock section) -->
    <rect class="bldg-fill stroke-main" x="231" y="44" width="38" height="24"/>
    <!-- Tower Level 2 Cornice -->
    <path class="bldg-fill stroke-main" d="M229 44 L271 44 L271 41 L229 41 Z"/>

    <!-- Tower Cupola / Roof (Pyramidal / Bell top) -->
    <path class="bldg-fill stroke-main" d="M231 41 L250 28 L269 41 Z"/>

    <!-- Spire and Flagpole -->
    <line class="stroke-main" x1="250" y1="28" x2="250" y2="15"/>
    <!-- Flag -->
    <path class="stroke-main" fill="#a4c1e4" d="M250 16 C255 14, 260 19, 265 17 L265 24 C260 26, 255 21, 250 23 Z"/>

    <!-- Tower Details -->
    <!-- Clock / Round Opening -->
    <ellipse cx="250" cy="54" rx="4.5" ry="6" class="window-fill" opacity="0.8"/>
    <!-- Belfry Arch Window -->
    <path class="window-fill" opacity="0.75" d="M246 86 L246 95 L254 95 L254 86 A4 4 0 0 0 246 86 Z"/>

    <!-- ==================== WINDOWS ==================== -->
    <!-- Left Wing Upper Windows (4) -->
    <rect class="window-fill" x="137" y="145" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="156" y="145" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="175" y="145" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="194" y="145" width="8.5" height="17" rx="1.5"/>

    <!-- Left Wing Lower Windows (4) -->
    <rect class="window-fill" x="137" y="174" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="156" y="174" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="175" y="174" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="194" y="174" width="8.5" height="17" rx="1.5"/>

    <!-- Center Upper Windows (3) -->
    <rect class="window-fill" x="224" y="140" width="9.5" height="18" rx="1.5"/>
    <rect class="window-fill" x="245" y="140" width="9.5" height="18" rx="1.5"/>
    <rect class="window-fill" x="266" y="140" width="9.5" height="18" rx="1.5"/>

    <!-- Center Lower Windows (2 flanking entrance) -->
    <rect class="window-fill" x="224" y="174" width="9" height="17" rx="1.5"/>
    <rect class="window-fill" x="267" y="174" width="9" height="17" rx="1.5"/>

    <!-- Center Main Entrance -->
    <path class="bldg-fill stroke-thin" d="M239 206 L239 181 A11 11 0 0 1 261 181 L261 206 Z"/>
    <path class="window-fill" opacity="0.65" d="M242 206 L242 182 A8 8 0 0 1 258 182 L258 206 Z"/>

    <!-- Right Wing Upper Windows (4) -->
    <rect class="window-fill" x="297" y="145" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="316" y="145" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="335" y="145" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="354" y="145" width="8.5" height="17" rx="1.5"/>

    <!-- Right Wing Lower Windows (4) -->
    <rect class="window-fill" x="297" y="174" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="316" y="174" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="335" y="174" width="8.5" height="17" rx="1.5"/>
    <rect class="window-fill" x="354" y="174" width="8.5" height="17" rx="1.5"/>

    <!-- Entrance Plinth & Steps -->
    <line class="stroke-main" x1="120" y1="206" x2="380" y2="206"/>
    <polygon class="bldg-fill stroke-main" points="208,206 202,213 298,213 292,206"/>
    <polygon class="bldg-fill stroke-main" points="202,213 197,219 303,219 298,213"/>
  </g>

  <!-- ==================== LEFT TREES & SHRUBS ==================== -->
  <g id="left-landscape">
    <!-- Tall Poplar/Cypress Tree (far left) -->
    <!-- Trunk -->
    <line class="trunk" x1="54" y1="165" x2="54" y2="220"/>
    <line class="branch" x1="54" y1="175" x2="47" y2="160"/>
    <line class="branch" x1="54" y1="168" x2="61" y2="155"/>
    <!-- Foliage -->
    <ellipse class="tree-fill stroke-thin" cx="54" cy="150" rx="19" ry="36"/>

    <!-- Mid-left Deciduous Tree -->
    <!-- Trunk -->
    <line class="trunk" x1="97" y1="185" x2="97" y2="220"/>
    <line class="branch" x1="97" y1="192" x2="90" y2="180"/>
    <!-- Foliage -->
    <ellipse class="tree-fill stroke-thin" cx="97" cy="168" rx="15" ry="26"/>

    <!-- Foreground Bush / Shrubs (left) -->
    <!-- Small bare tree/branch behind bush -->
    <line class="trunk" x1="125" y1="195" x2="125" y2="220"/>
    <line class="branch" x1="125" y1="204" x2="119" y2="194"/>
    <line class="branch" x1="125" y1="202" x2="132" y2="192"/>

    <path class="tree-fill stroke-thin" d="M84 219 C84 196 112 195 119 203 C127 194 153 197 150 219 Z"/>

    <!-- Left Ground Mound -->
    <path fill="url(#moundGrad)" class="stroke-thin" d="M30 232 C65 212 135 212 185 232 Z"/>
  </g>

  <!-- ==================== RIGHT TREES & SHRUBS ==================== -->
  <g id="right-landscape">
    <!-- Far Right Rounded Tree -->
    <!-- Trunk -->
    <line class="trunk" x1="434" y1="175" x2="434" y2="220"/>
    <line class="branch" x1="434" y1="184" x2="427" y2="173"/>
    <line class="branch" x1="434" y1="179" x2="440" y2="170"/>
    <!-- Foliage -->
    <ellipse class="tree-fill stroke-thin" cx="434" cy="155" rx="26" ry="34"/>

    <!-- Mid-Right Rounded Canopy / Tree -->
    <!-- Trunk -->
    <line class="trunk" x1="388" y1="195" x2="388" y2="220"/>
    <line class="branch" x1="388" y1="200" x2="382" y2="188"/>
    <line class="branch" x1="388" y1="198" x2="394" y2="189"/>
    <!-- Foliage Cloud -->
    <path class="tree-fill stroke-thin" d="M358 219 C345 204 360 178 382 180 C392 169 414 172 419 187 C429 194 425 212 418 219 Z"/>

    <!-- Right Ground Mound -->
    <path fill="url(#moundGrad)" class="stroke-thin" d="M315 232 C365 212 435 212 470 232 Z"/>
  </g>
</svg>
